name = "i-save"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# One Worker serves both the website and the API.
# Build the web app first (pnpm --filter @isave/web build); this folder is what gets served.
[assets]
directory = "../../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/staff/register-member", "/staff/create-staff", "/assistant", "/health"]

# Public settings. Secrets are NOT kept here: set the service role key in the Cloudflare
# dashboard (Settings -> Variables and secrets).
[vars]
SUPABASE_URL = "https://vbxqvccdadtpzrykizna.supabase.co"
# The live address of the site. Local development overrides both in workers/api/.dev.vars.
ALLOWED_ORIGIN = "https://i-save.persytchikanya.workers.dev"
APP_URL = "https://i-save.persytchikanya.workers.dev"

# Sends queued email notifications every minute (does nothing until Resend is configured).
[triggers]
crons = ["* * * * *"]

# Keeps request and error logs in the Cloudflare dashboard (Workers & Pages > i-save > Logs),
# so a failing email run or API error can be seen after the fact.
[observability]
enabled = true

# Free AI for the in-site assistant (Cloudflare Workers AI: 10,000 free neurons a day, no card).
[ai]
binding = "AI"
