<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1c24" />
    <script>
      // Sets the light or dark theme before the first paint so the page never flashes the
      // wrong colours. Keep in step with src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("isave-theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          var root = document.documentElement;
          if (t === "light") root.classList.add("light");
          root.style.colorScheme = t;
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute("content", t === "light" ? "#f7fafa" : "#0b1c24");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="i-Save" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,800&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
    />
    <title>i-Save</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
